  caption: >-
    SUBJECT: A human male warrior, medium athletic build, standing upright. Image 1 shows his standing pose from eight directions; Image 2 shows the first frames of his other animations: mace swings, a hit reaction, walking and a death fall.


    BODY AND MATERIALS: Bare, tanned arms; dark brown hair tied back. He wears a sleeveless red leather jerkin laced with dark straps over the chest, and a single steel pauldron on his left shoulder. Red leather bracers on the forearms. Blue-grey cloth trousers tucked into tall red leather boots.


    EQUIPMENT: A one-handed flanged steel mace with a short reddish-brown haft, held in his right hand. No shield, no helmet, nothing on his back.


    COLOURS: Jerkin, bracers and boots in rust red with dark brown shading; trousers blue-grey; skin warm tan; hair dark brown; pauldron and mace head grey steel.


    SHADOW: A solid black shadow on the ground, cast behind the figure to the left.


    INVARIANTS: The single left-shoulder pauldron, the red jerkin with bare arms, the blue trousers and red boots, the ponytail, and the short one-handed mace keep their places and proportions in every frame and direction.
