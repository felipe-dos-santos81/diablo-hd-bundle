towners/smith:
  animations:
  - towners/smith/smithn.cel
  - towners/smith/smithw.cel
  anchor: towners/smith/smithn.cel
  caption: >-
    SUBJECT: The town blacksmith: a stout, heavy-set middle-aged man with a big belly and thick arms. Image 1 is his standing pose; Image 2 shows him walking. Both face mostly toward the viewer.


    BODY AND MATERIALS: Bald head with a short grey beard; ruddy pink skin. He wears a sleeveless rust-red wool tunic belted at the waist, red trousers, pale cloth wrappings on the shins, and brown leather boots. His arms are bare with leather wrist bands.


    EQUIPMENT: A wide dark leather belt with a metal buckle. No tools, weapons or armour in these frames.


    COLOURS: Tunic and trousers rust red to brick red with darker maroon shading; skin ruddy pink; beard grey; belt, boots and wrist bands dark brown leather; shin wrappings pale beige.


    SHADOW: A solid dark shadow on the ground, cast behind him to the left.


    INVARIANTS: His bald head and grey beard, the sleeveless red tunic and wide belt, and his heavy proportions stay the same in every frame and direction.
