  caption: >-
    SUBJECT: A gaunt humanoid zombie with a slightly hunched, forward-leaning stance and long thin limbs. Image 1 shows its standing pose from eight directions; Image 2 shows the first frames of its other animations (attacking, hit, death, walking).


    BODY AND MATERIALS: Naked, emaciated body of rotting, leathery skin stretched over wiry muscle, with raw bloody wounds. Bald head. No clothing, hair or bone showing through.


    EQUIPMENT: None. It fights with its bare hands.


    COLOURS: Skin olive-khaki to dull ochre with darker brown-green shading; the wounds are dark blood red, on the crown of the head, the shoulders and upper back, and in patches on the arms and legs.


    SHADOW: A dark, soft-edged shadow on the ground, cast behind the figure to the left.


    INVARIANTS: The gaunt proportions, the olive rotting skin and the placement of the red wounds (crown, shoulders, back, limbs) stay the same in every frame and direction.
