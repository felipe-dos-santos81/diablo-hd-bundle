    SHADOW: None visible; the effect itself lies flat on the ground plane.


    INVARIANTS: The overall footprint (width and length) of the effect remains consistent between the two images. The outer silhouette maintains the same jagged, horizontal orientation. The specific pixel arrangement of the outline (grey/blue-grey border) is identical in both frames.
