  caption: >-
    SUBJECT: A humanoid demon. It has a stocky, muscular build and hunched posture, with a heavy torso, thick arms, and short legs. Its head is small relative to its body. Image 1 shows its standing pose from eight directions; it stands hunched and leaning forward.


    BODY AND MATERIALS: The entire body appears composed of dark, textured organic material, possibly charred flesh or rock-like skin. This base surface is covered in branching, glowing cracks that resemble hot magma or lava veins. There are no visible cloth, leather, or metal components on the body itself.


    EQUIPMENT: None. The creature is unarmed and unarmored.


    COLOURS: The primary color is a very dark grey or black for the solid body mass. The cracks are bright orange and red, with small patches of yellow-white at their brightest points.


    SHADOW: Each frame casts a soft, dark shadow directly beneath the figure, extending slightly to the left and rear. The shadow conforms to the character's footprint.


    INVARIANTS: The pattern of glowing cracks must remain consistent across all frames and directions, shifting only with the limb movement. The hunched posture, relative limb thickness, and dark body-to-glow ratio are constant. Image 2 displays first frames of other animations: its thrown projectile, a ball of dark rock laced with the same glowing lava cracks, and the first frames of the creature's own attack, hit, death and walk animations.
