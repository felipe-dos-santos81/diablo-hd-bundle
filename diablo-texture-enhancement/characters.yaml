'@DIABDAT.MPQ/monsters/goatlord':
  animations:
  - '@DIABDAT.MPQ/monsters/goatlord/goatld.cl2'
  anchor: '@DIABDAT.MPQ/monsters/goatlord/goatld.cl2'
  caption: >-
    SUBJECT: A winged humanoid demon, slender build with a long tail. Poses are standing or mid-stride in an isometric view, facing eight different directions.


    BODY AND MATERIALS: Pale, greyish-white skin on the head, neck, and limbs. Dark red, membranous wings attached to the back. A long, thin, segmented tail extends from the lower back.


    EQUIPMENT: A long, two-handed weapon resembling a scythe or glaive, held in the right hand. The blade is curved and metallic; the shaft is dark wood or bone. No visible armour or shield.


    COLOURS: Dominant colours are pale off-white (skin), deep crimson/dark red (wings), and black/dark brown (weapon shaft, tail). Highlights on the weapon blade are light grey/white.


    SHADOW: A distinct, dark drop shadow is cast on the ground beneath the figure. The shape mirrors the character's stance and weapon position, extending generally to the bottom-left of each sprite.


    INVARIANTS: The skeletal facial structure with prominent horns, the specific membrane texture of the wings, the segmented tail, and the distinct curved shape of the scythe blade remain consistent across all directional frames.
'@DIABDAT.MPQ/monsters/unrav':
  animations:
  - '@DIABDAT.MPQ/monsters/unrav/unrava.cl2'
  anchor: '@DIABDAT.MPQ/monsters/unrav/unrava.cl2'
  caption: >-
    SUBJECT: A standing humanoid monster, roughly average height with a slim build. The reference animation shows eight frames representing different viewing angles (front, three-quarter, profile, back). It stands upright in a neutral, idle pose with arms hanging at its sides and feet slightly apart.


    BODY AND MATERIALS: The entire body is covered in a dense, mottled pattern resembling scales or rough bark, giving it a textured, non-organic appearance. There are no visible cloth, leather, or metal materials on the body itself.


    EQUIPMENT: None. No weapons, shields, or armor pieces are carried or worn.


    COLOURS: The dominant color is a dark olive green or muddy brown, heavily speckled with lighter beige and yellowish-green spots. On the chest of the front-facing sprites, there is a distinct patch of bright orange or reddish-orange, possibly glowing. The head features small points of red or pink near the face area.


    SHADOW: A faint, flat, dark shadow is visible directly beneath the character's feet, anchoring it to the ground plane.


    INVARIANTS: The mottled, scale-like skin texture covers the entire figure in all directions. The specific arrangement of limbs—arms straight down, legs shoulder-width apart—remains consistent across the directional frames. The orange marking on the chest remains present when the front is visible.
