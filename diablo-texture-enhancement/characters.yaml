  - monsters/nkr/nkrw.cl2
  anchor: monsters/nkr/nkrn.cl2
  caption: >-
    SUBJECT: A large bipedal demon with a hulking, armoured body, broad shoulders, thick legs and clawed three-toed feet. Its head is sunk low between the shoulders. Image 1 shows its standing pose from eight directions; Image 2 shows the first frames of its other animations, including a death in which it bursts into fire.


    BODY AND MATERIALS: Its whole body is covered in glossy crimson chitin plates, ridged and segmented like an insect's shell, with paler pinkish flesh showing between the plates on the chest and belly. Long segmented tentacles rise from its back and arch over its head, each ending in a curved steel-grey sickle blade; more segmented whip-like tendrils hang from its forearms.


    EQUIPMENT: None carried. The blades are part of its body.


    COLOURS: Crimson and bright red plates with dark maroon shading; pale pink flesh between plates; small olive-green accents at the elbows; the sickle blades steel grey. The death animation adds orange and yellow flames at its feet.


    SHADOW: A dark, soft-edged shadow on the ground, cast behind the figure to the left.


    INVARIANTS: The number and placement of the blade-tipped back tentacles, the forearm tendrils, the red chitin armour and the clawed feet stay the same in every frame and direction.
