  caption: >-
    SUBJECT: A small, skeletal arachnid or insectoid creature. It has a segmented body with a distinct head and abdomen, supported by eight spindly legs. Its posture is low to the ground, crawling.


    BODY AND MATERIALS: The entire visible structure appears to be bone or chitin, resembling a desiccated exoskeleton. There are no soft tissues, fur, or cloth visible.


    EQUIPMENT: None.


    COLOURS: The primary color is a pale, off-white or light grey for the skeleton. Small accents of dark yellow or gold are present along the dorsal spine segments.


    SHADOW: A flat, black shadow is cast directly beneath the creature, conforming to its silhouette and extending slightly forward.


    INVARIANTS: The creature maintains a consistent eight-legged structure across all frames. The relative proportions of the head, thorax, and abdomen remain constant. The leg joint angles shift to accommodate movement but do not change in length or thickness. The dorsal golden markings persist on the spine in every view.
