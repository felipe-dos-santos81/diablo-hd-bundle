  - missiles/fireba15.cl2
  - missiles/fireba16.cl2
  anchor: missiles/fireba1.cl2
  caption: >-
    SUBJECT: A small fireball or flame projectile. It has a teardrop build, with a bright spherical core at the base and a tapering tail of flame extending from it.


    BODY AND MATERIALS: The entire subject is composed of flame. There are no solid materials like skin, cloth, or metal visible.


    EQUIPMENT: None.


    COLOURS: The core of the flame is bright yellow and white. This transitions outward to orange, then to a darker red-brown at the edges and along the length of the tail.


    SHADOW: None.


    INVARIANTS: The fundamental structure must remain consistent: a glowing central orb with an attached, trailing flame shape. In Image 2, this structure is shown oriented in various directions (up, down, left, right, diagonals), but the relationship between the bright core and the trailing flame remains constant. The internal color gradient (white/yellow center to red/brown edge) is also invariant.
